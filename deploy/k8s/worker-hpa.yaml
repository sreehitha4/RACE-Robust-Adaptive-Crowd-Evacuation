apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: race-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: race-worker
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
